[project]
name = "open_deep_research"
version = "0.0.16"
description = "Planning, research, and report generation for Termux."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.5.4",
    "langchain-community>=0.3.9",
    "langchain-openai>=0.3.28",
    "langchain-anthropic>=0.3.15",
    "langchain-deepseek>=0.1.2",
    "langchain-groq>=0.2.4",
    "openai>=1.99.2",
    "tavily-python>=0.5.0",
    "arxiv>=2.1.3",
    "xmltodict>=0.14.2",
    "duckduckgo-search>=3.0.0",
    "requests>=2.32.3",
    "beautifulsoup4==4.14.3",
    "python-dotenv>=1.0.1",
    "httpx>=0.24.0",
    "markdownify>=0.11.6",
    "rich>=13.0.0",
    "langsmith>=0.3.37",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
all = [
    "langchain-mcp-adapters>=0.1.6",
    "langchain-google-vertexai>=2.0.25",
    "langchain-google-genai>=2.1.5",
    "langchain-aws>=0.2.28",
    "linkup-sdk>=0.2.3",
    "exa-py>=1.8.8",
    "pandas>=2.3.1",
    "pymupdf>=1.25.3",
    "supabase>=2.15.3",
    "mcp>=1.9.4",
]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["open_deep_research", "legacy", "tests"]

[tool.setuptools.package-dir]
"open_deep_research" = "src/open_deep_research"
"legacy" = "src/legacy"
"tests" = "tests"

[tool.setuptools.package-data]
"*" = ["py.typed"]